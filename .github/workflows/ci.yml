name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Package backend
        run: mvn -pl yudao-server -am -DskipTests package
      - name: Test hotel core and production scheduler
        run: >-
          mvn -pl yudao-module-infra,yudao-module-merchant,yudao-module-booking -am
          -Dtest=JobSchedulerInitializerTest,MerchantStaffControllerTest,BookingInventoryControllerTest,BookingOrderControllerTest,BookingOrderPermissionContractTest,BookingOrderResponseAssemblerTest,BookingRoomTypeControllerTest,BookingOrderServiceImplTest,BookingStockServiceImplTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-admin-vue3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Type check (known baseline debt)
        continue-on-error: true
        run: pnpm ts:check

  deployment:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: hotel_pms_community
      MYSQL_USER: hotel
      MYSQL_PASSWORD: ci-mysql-password
      MYSQL_ROOT_PASSWORD: ci-mysql-root-password
      REDIS_PASSWORD: ci-redis-password
      MYBATIS_ENCRYPTOR_PASSWORD: ci-encryptor-password
      PUBLIC_BASE_URL: https://hotel-pms.example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose model
        run: docker compose -f compose.production.yaml config --quiet

  boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify commercial boundary and credentials
        shell: pwsh
        run: ./tools/verify-community.ps1 -SkipBuild
