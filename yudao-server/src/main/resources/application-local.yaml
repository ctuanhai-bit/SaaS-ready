server:
  port: ${SERVER_PORT:48080}

spring:
  boot:
    admin:
      context-path: /admin
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
  datasource:
    druid:
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          name: hotel_pms_community
          url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hotel_pms_community?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}
          username: ${DB_USERNAME:hotel_pms}
          password: ${DB_PASSWORD:hotel_pms}
          driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
  quartz:
    auto-startup: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

logging:
  file:
    name: ${LOG_FILE:${user.home}/logs/${spring.application.name}.log}
  level:
    cn.iocoder.yudao.module.booking: info
    cn.iocoder.yudao.module.merchant: info

yudao:
  captcha:
    enable: ${CAPTCHA_ENABLED:false}
  security:
    mock-enable: false
  access-log:
    enable: false

justauth:
  enabled: false

debug: false
